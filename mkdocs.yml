site_name: Programação Orientada a Objetos II
site_author: Eduardo da Silva
site_url: https://eduardo-da-silva.github.io/poo2
repo_url: https://github.com/eduardo-da-silva/poo2
repo_name: eduardo-da-silva/poo2
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Eduardo da Silva

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eduardo-da-silva

theme:
  name: material
  favicon: images/favicon.svg
  icon:
    logo: fontawesome/solid/code
  language: pt-BR
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: lucide/sun
        name: Ativar modo escuro
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: lucide/moon
        name: Ativar modo claro
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: eduardo-da-silva
      repo: poo2
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Início: index.md
  - Módulo 1 — Construindo o Domínio:
    - Visão geral do módulo: modulo1/index.md
    - Capítulo 1 — O que significa projetar software: modulo1/capitulo1.md
    - Capítulo 2 — Conhecendo o domínio: modulo1/capitulo2.md
    - Capítulo 3 — Primeiras entidades e relacionamentos: modulo1/capitulo3.md
    - "Capítulo 4 — Mão na massa: implementando as classes": modulo1/capitulo4.md
    - Mapa do conhecimento: modulo1/mapa-conhecimento.md
  - Módulo 2 — Evoluindo o Domínio:
    - Visão geral do módulo: modulo2/index.md
    - Capítulo 5 — Do carrinho ao pedido: modulo2/capitulo5.md
    - Capítulo 6 — O ciclo de vida do pedido: modulo2/capitulo6.md
    - Capítulo 7 — O fluxo completo de compra: modulo2/capitulo7.md
    - Mapa do conhecimento: modulo2/mapa-conhecimento.md
    - Entrega da Primeira Parte do Projeto: modulo2/entrega.md
  - Módulo 3 — Estratégias:
    - Visão geral do módulo: modulo3/index.md
    - Capítulo 8 — O problema dos descontos: modulo3/capitulo8.md
    - "Capítulo 9 — Strategy: desconto como objeto": modulo3/capitulo9.md
    - Capítulo 10 — Cupom: modulo3/capitulo10.md
    - Capítulo 11 — Frete: modulo3/capitulo11.md
    - Mapa do conhecimento: modulo3/mapa-conhecimento.md
    - Entrega da Segunda Parte do Projeto: modulo3/entrega.md
  - Módulo 4 — Criando Objetos:
    - Visão geral do módulo: modulo4/index.md
    - Capítulo 12 — Formas de pagamento e o problema da criação: modulo4/capitulo12.md
    - "Capítulo 13 — Meios de entrega: Factory Method": modulo4/capitulo13.md
    - Capítulo 14 — Notificações: modulo4/capitulo14.md
    - "Capítulo 15 — Quem entrega as dependências?": modulo4/capitulo15.md
    - Mapa do conhecimento: modulo4/mapa-conhecimento.md
    - Entrega da Terceira Parte do Projeto: modulo4/entrega.md
  - Mapa do Conhecimento - até módulo 4: mapa-conceitos.md